# Managed by MockPad deployment; included only in kishibe.dyndns.tv's HTTPS server.
location = /mockpad {
    return 308 /mockpad/;
}

location ^~ /mockpad/ {
    # Preserve the /mockpad prefix; Rust mounts its own router at that path.
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    client_max_body_size 256k;
    limit_req zone=mockpad_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn mockpad_connections 16;
    limit_conn_status 429;

    # Retain the host's TLS policy while preserving MockPad's stricter referrer policy.
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
